name: Release
on:
  push:
    tags: ['v*-miku.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile
      - name: Verify tag
        run: node -e "if ('v'+require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: pnpm run check
      - run: pnpm run preview
      - run: pnpm run check:design
      - id: pack
        run: node scripts/verify-pack.mjs --keep
      - name: Publish GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          cp "$TARBALL" dsh-genui.tgz
          sha256sum dsh-genui.tgz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dsh-genui.tgz SHA256SUMS .e2e-artifacts/preview/genui-light.html .e2e-artifacts/preview/genui-dark.html .e2e-artifacts/preview/stepper-light.html .e2e-artifacts/preview/stepper-dark.html .e2e-artifacts/preview/threshold-light.html .e2e-artifacts/preview/threshold-dark.html --verify-tag --latest --title "GenUI $GITHUB_REF_NAME" --notes-file .github/release-notes.md
